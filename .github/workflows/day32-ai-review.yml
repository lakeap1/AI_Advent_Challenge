name: Day32 AI review
on:
  workflow_run:
    workflows: [Day32 review request]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
jobs:
  fork-status:
    if: github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record explicit fork skip without secrets
        run: printf '%s\n' 'AI review skipped for a fork. No model request was made.' >> "$GITHUB_STEP_SUMMARY"
  review:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: day32-capsule-review
      cancel-in-progress: false
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up trusted Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Prepare Git data and request the fixed capsule worker
        working-directory: week_7/task_2
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REVIEW_SSH_HOST: ${{ secrets.PR_REVIEW_SSH_HOST }}
          PR_REVIEW_SSH_KEY: ${{ secrets.PR_REVIEW_SSH_KEY }}
          PR_REVIEW_KNOWN_HOSTS: ${{ secrets.PR_REVIEW_KNOWN_HOSTS }}
        run: python -B -m pr_review.ci_driver --repo "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/day32-report"
      - name: Store the report without the raw source snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day32-review-${{ github.event.workflow_run.id }}
          path: |
            ${{ runner.temp }}/day32-report/review.json
            ${{ runner.temp }}/day32-report/review.html
          if-no-files-found: error
          retention-days: 14
